name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

  frontend-build:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/onlinejudge/package-lock.json

      - name: Install dependencies
        working-directory: frontend/onlinejudge
        run: npm ci

      - name: Lint
        working-directory: frontend/onlinejudge
        run: npm run lint

      - name: Build
        working-directory: frontend/onlinejudge
        run: npm run build

  backend-app-docker-build:
    name: Backend app Docker image build
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend app image
        run: docker build -t online-judge-backend:ci backend

  sandbox-images-build-and-smoke-test:
    name: Sandbox runtime images (build + real execution smoke test)
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build C++/C sandbox image
        run: docker build -f backend/docker/cpp.Dockerfile -t oj-cpp-runtime:ci backend

      - name: Build Java sandbox image
        run: docker build -f backend/docker/java.Dockerfile -t oj-java-runtime:ci backend

      - name: Build Python sandbox image
        run: docker build -f backend/docker/python.Dockerfile -t oj-python-runtime:ci backend

      - name: Smoke test every sandbox image actually executes code
        working-directory: backend
        run: node docker/smoke-test.mjs
